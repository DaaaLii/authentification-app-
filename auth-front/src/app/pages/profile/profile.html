<div class="min-h-[100dvh] grid place-items-center p-6 bg-slate-50">
  <mat-card
    class="w-full max-w-xl rounded-3xl bg-white border border-slate-200/70
           shadow-[0_18px_40px_-20px_rgba(15,23,42,0.35)]
           p-8 sm:p-10"
  >
    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-4xl font-extrabold tracking-tight text-slate-900">Mon profil</h2>
      <p class="mt-2 text-base text-slate-500">Gère tes informations personnelles.</p>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="rounded-2xl border border-slate-200 bg-slate-50 p-6 text-slate-600">
      Chargement du profil...
    </div>

    <!-- Content -->
    <ng-container *ngIf="!loading && user">

      <!-- Avatar block -->
      <div class="mb-8 rounded-2xl border border-slate-200 bg-slate-50 p-4">
        <div class="flex items-center gap-6">
          <!-- Avatar -->
          <div
            class="h-20 w-20 overflow-hidden rounded-2xl border border-slate-200 bg-white grid place-items-center shrink-0"
          >
            <!-- ✅ on utilise avatar (URL backend) car c'est ce que ton TS remplit -->
            <img
              *ngIf="avatar; else fallback"
              [src]="avatar"
              alt="Avatar"
              class="h-full w-full object-cover"
            />
            <ng-template #fallback>
              <div class="text-2xl font-extrabold text-slate-700">{{ initial }}</div>
            </ng-template>
          </div>

          <div class="min-w-0">
            <!-- ✅ displayName vient de TS -->
            <div class="font-semibold text-slate-900 truncate">{{ displayName }}</div>
            <div class="text-sm text-slate-500 truncate">{{ user?.email || 'user@mail.com' }}</div>

            <div class="mt-3 flex flex-wrap items-center gap-3">
              <label class="cursor-pointer">
                <button
                  mat-stroked-button
                  type="button"
                  class="!rounded-2xl !border-slate-200 !text-slate-900 hover:!bg-slate-50"
                  (click)="fileInput.click()"
                >
                  
                
                  <mat-icon class="!mr-2">photo_camera</mat-icon>
                  Changer la photo
                  
                </button>
                <input
                  type="file"
                  accept="image/*"
                  (change)="onAvatarSelected($event)"
                  class="hidden"
                  #fileInput
                  
                />

             
              </label>

              <!-- ✅ bouton copier ID (existe dans TS) -->
              <button
                mat-stroked-button
                type="button"
                class="!rounded-2xl !border-slate-200 !text-slate-900 hover:!bg-slate-50"
                (click)="copyId()"
              >
                <mat-icon class="!mr-2">content_copy</mat-icon>
                Copier ID
              </button>
              <button
               mat-raised-button
               color="primary"
               class="w-full !rounded-2xl !h-12"
               type="button"
              (click)="goToProducts()"
              >
               <mat-icon class="!mr-2">inventory_2</mat-icon>
                Voir la liste des produits
              </button>



              <!-- ✅ feedback "copié" (existe dans TS) -->
              <span *ngIf="copied" class="text-sm font-semibold text-green-700">
                Copié ✅
              </span>
            </div>

            <p class="mt-2 text-xs text-slate-500">PNG/JPG • recommandé: carré • max ~3MB</p>
          </div>
        </div>
      </div>

      <!-- Infos (lecture seule) -->
      <div class="grid gap-6">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Nom</mat-label>
          <input matInput [value]="user?.name || ''" disabled />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput [value]="user?.email || ''" disabled />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>ID</mat-label>
          <input matInput [value]="user?.id || user?._id || ''" disabled />
        </mat-form-field>

        <mat-divider class="!my-2"></mat-divider>

        <button
          mat-stroked-button
          class="w-full !rounded-2xl !h-12 !border-blue-200 !text-blue-700 hover:!bg-blue-50"
          type="button"
          (click)="logout()"
        >
          <mat-icon class="!mr-2">logout</mat-icon>
          Se déconnecter
        </button>
      </div>

    </ng-container>

    <!-- Empty state -->
    <div *ngIf="!loading && !user" class="rounded-2xl border border-slate-200 bg-slate-50 p-6 text-slate-700">
      Profil indisponible. Veuillez vous reconnecter.
      <div class="mt-4">
        <button
          mat-raised-button
          color="primary"
          class="!rounded-2xl"
          type="button"
          (click)="router.navigateByUrl('/login')"
        >
          Aller au login
        </button>
      </div>
    </div>

  </mat-card>
</div>
